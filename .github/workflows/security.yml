name: Security

on:
  push:
    branches: [main, "feature/**", "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-security:
    name: Web dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Scan committed content for secrets
        run: npm run security:secrets
      - name: Reject high/critical production dependency vulnerabilities
        run: npm run security:audit

  codeql:
    name: CodeQL (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          # This private repository does not have GitHub Code Scanning enabled.
          # Keep the SARIF local and enforce the severity gate in the next step.
          upload: never
          upload-database: false
          wait-for-processing: false
          output: codeql-results
      - name: Reject high/critical CodeQL findings
        run: node scripts/security/check-codeql-sarif.mjs codeql-results/javascript.sarif
      - name: Upload CodeQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          retention-days: 30

  android:
    name: Android companion lint, tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        run: gradle -p android-companion testDebugUnitTest
      - name: Android lint
        run: gradle -p android-companion lintDebug
      - name: Build internal debug APK for verification only
        run: gradle -p android-companion assembleDebug
      - name: Upload reports (never distribute debug APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-security-reports
          path: |
            android-companion/app/build/reports/
            android-companion/app/build/test-results/
          retention-days: 14
