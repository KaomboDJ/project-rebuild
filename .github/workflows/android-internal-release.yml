name: Android Internal Release

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-internal-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build signed internal APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-internal-release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Materialize the protected signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          key_path="$RUNNER_TEMP/rebuild-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "REBUILD_KEYSTORE_FILE=$key_path" >> "$GITHUB_ENV"

      - name: Test, lint and build the signed release
        env:
          REBUILD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          REBUILD_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          REBUILD_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REBUILD_KEYSTORE_PASSWORD"
          test -n "$REBUILD_KEY_ALIAS"
          test -n "$REBUILD_KEY_PASSWORD"
          gradle -p android-companion testReleaseUnitTest lintRelease assembleRelease

      - name: Verify signature and produce integrity evidence
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android-companion/app/build/outputs/apk/release -type f -name '*-release.apk' ! -name '*-unsigned.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee signer-certificate.txt
          mkdir -p release-evidence
          cp "$apk" release-evidence/rebuild-companion-internal.apk
          cp signer-certificate.txt release-evidence/
          cd release-evidence
          sha256sum rebuild-companion-internal.apk > rebuild-companion-internal.apk.sha256

      - name: Upload private release candidate
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-companion-signed-candidate
          path: release-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/rebuild-release.jks"
